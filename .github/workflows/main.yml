name: CI

# Chạy khi có push hoặc pull request vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # 1. Lấy code từ repo về máy chạy Action
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'   # cache node_modules để build nhanh hơn lần sau

      # 3. Cài dependencies
      - name: Install dependencies
        run: npm ci

      # 4. (Tuỳ chọn) Kiểm tra lint nếu project có cấu hình eslint
      - name: Lint
        run: npm run lint --if-present

      # 5. Build project (nếu là TypeScript hoặc có bước build)
      - name: Build
        run: npm run build --if-present

      # 6. Chạy test
      - name: Run tests
        run: npm test --if-present
